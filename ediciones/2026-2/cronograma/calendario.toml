# ============================================================
# CALENDARIO DE LA EDICIÓN
# ============================================================

# El curso se reúne ordinariamente los martes.
inicio = 2026-08-25
fin = 2026-12-15

# Las semanas se cuentan de lunes a domingo.
inicio_semana = "lunes"

# Escribe los días ordinarios de clase con tilde cuando corresponda.
dias_clase = ["martes"]

# Formato breve mostrado en el cronograma.
formato_fecha = "breve"

# Muestra la columna Sesión cuando hay varias sesiones por semana.
mostrar_sesion = false

# ============================================================
# EXCEPCIONES
# ============================================================

[[excepciones]]
fecha = 2026-08-25
modalidad = "sin clase"
nota = "No hubo clase."

[[excepciones]]
fecha = 2026-11-03
modalidad = "simposio"
nota = "No habrá clase ordinaria; la actividad académica corresponde a la participación en el Simposio."